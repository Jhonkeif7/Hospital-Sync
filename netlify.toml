# Hospital Sync — despliegue del frontend (Vite + React)
# En el panel de Netlify, deja Base directory = frontend o vacío si usas solo este archivo.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--prefer-offline --no-audit"

# SPA: React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Caché agresiva para assets con hash (Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
